group 'dev.admobkit.flutter_admob_kit'
version '1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.1' }
}
apply plugin: 'com.android.library'

android {
    namespace 'dev.admobkit.flutter_admob_kit'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
repositories { google(); mavenCentral() }
dependencies { implementation project(':google_mobile_ads') }
