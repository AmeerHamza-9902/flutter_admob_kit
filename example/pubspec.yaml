name: flutter_admob_kit_example
description: Example app for flutter_admob_kit
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_admob_kit:
    path: ../
  # Keep the example's CocoaPods lockfile in sync with CI resolution.
  google_mobile_ads: 9.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
